<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniworth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white px-6">

  <nav class="bg-white px-6 py-4 flex justify-between">
    <img src="logo.png" alt="Uniworth Logo" class="h-12">

    <ul class="hidden md:flex gap-8 text-sm font-medium">
      <li><a href="#">Home</a></li>
      <li><a href="#">Shop</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>

    <div class="flex items-center gap-4">
      <span class="text-xl">🛒</span>
      <button class="md:hidden text-2xl" onclick="document.getElementById('menu').classList.toggle('hidden')">☰</button>
    </div>
  </nav>

  <ul id="menu" class="hidden md:hidden flex flex-col gap-4 px-6 py-4 bg-white text-sm font-medium">
    <li><a href="#">Home</a></li>
    <li><a href="#">Shop</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Contact</a></li>
  </ul>

  <main class="px-6 py-10">
    <h2 class="text-2xl font-bold mb-6">Products</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

      <div class="border p-4">
        <img src="shirt.jpg" alt="Product" class="w-full h-60 object-cover mb-3">
        <h3 class="font-semibold">Crew Neck Shirt</h3>
        <p class="text-gray-500 text-sm">PKR 3,500</p>
        <button class="mt-3 w-full bg-black text-white py-2 text-sm">Add to Cart</button>
      </div>

      <div class="border p-4">
        <img src="trouser.jpg" alt="Product" class="w-full h-60 object-cover mb-3">
        <h3 class="font-semibold">Formal Trouser</h3>
        <p class="text-gray-500 text-sm">PKR 4,200</p>
        <button class="mt-3 w-full bg-black text-white py-2 text-sm">Add to Cart</button>
      </div>

      <div class="border p-4">
        <img src="sweater.jpg" alt="Product" class="w-full h-60 object-cover mb-3">
        <h3 class="font-semibold">Winter Sweater</h3>
        <p class="text-gray-500 text-sm">PKR 5,800</p>
        <button class="mt-3 w-full bg-black text-white py-2 text-sm">Add to Cart</button>
      </div>

      <div class="border p-4">
        <img src="jeans.jpg" alt="Product" class="w-full h-60 object-cover mb-3">
        <h3 class="font-semibold">Denim Jeans</h3>
        <p class="text-gray-500 text-sm">PKR 6,500</p>
        <button class="mt-3 w-full bg-black text-white py-2 text-sm">Add to Cart</button>
      </div>

      <div class="border p-4">
        <img src="casual.jpg" alt="Product" class="w-full h-60 object-cover mb-3">
        <h3 class="font-semibold">Casual Shirt</h3>
        <p class="text-gray-500 text-sm">PKR 3,200</p>
        <button class="mt-3 w-full bg-black text-white py-2 text-sm">Add to Cart</button>
      </div>

      <div class="border p-4">
        <img src="baggy.jpg" alt="Product" class="w-full h-60 object-cover mb-3">
        <h3 class="font-semibold">Baggy Pants</h3>
        <p class="text-gray-500 text-sm">PKR 5,000</p>
        <button class="mt-3 w-full bg-black text-white py-2 text-sm">Add to Cart</button>
      </div>

      <div class="border p-4">
        <img src="suit.jpg" alt="Product" class="w-full h-60 object-cover mb-3">
        <h3 class="font-semibold">Suit Jacket</h3>
        <p class="text-gray-500 text-sm">PKR 12,000</p>
        <button class="mt-3 w-full bg-black text-white py-2 text-sm">Add to Cart</button>
      </div>

      <div class="border p-4">
        <img src="polo.jpg" alt="Product" class="w-full h-60 object-cover mb-3">
        <h3 class="font-semibold">Polo Shirt</h3>
        <p class="text-gray-500 text-sm">PKR 2,800</p>
        <button class="mt-3 w-full bg-black text-white py-2 text-sm">Add to Cart</button>
      </div>

    </div>
  </main>

  

</body>
</html>
